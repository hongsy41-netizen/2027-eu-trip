<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 유럽 여행 — 항공 &amp; 지상 동선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="container">
    <h1 id="heroTitle">2027 유럽 여행 — 항공 &amp; 지상 동선</h1>
    <p class="subtitle" id="heroSubtitle">부다페스트(BUD) in/out · 베이징 경유 · 렌트카 · 시계방향 원형루프</p>
    <div class="hero-stats" id="heroStats"></div>
    <div class="route-summary" id="routeSummary"></div>
    <div class="edit-controls">
      <button id="editToggleBtn" class="edit-btn">✏ 편집 모드</button>
      <button id="resetBtn" class="edit-btn edit-btn-reset">↺ 초기화</button>
    </div>
  </div>
</header>

<main class="container">

  <section id="flights">
    <h2 class="section-title">✈ 항공 일정 (최종 확정)</h2>
    <div class="card" id="flightContent"></div>
  </section>

  <section id="phases">
    <h2 class="section-title">여정 단계 (9구간)</h2>
    <div class="phase-grid" id="phaseGrid"></div>
  </section>

  <section id="timeline">
    <h2 class="section-title">타임라인 (날짜별 일정)</h2>
    <div class="card">
      <div class="timeline" id="timelineList"></div>
    </div>
  </section>

  <section id="map-section">
    <h2 class="section-title">동선 지도 &amp; Day by Day</h2>
    <div class="map-layout">
      <div id="map"></div>
      <div id="daySidebar"></div>
    </div>
  </section>

  <section id="schedule">
    <h2 class="section-title">상세 일정표 (20일)</h2>
    <div class="table-wrap">
      <table id="scheduleTable"></table>
    </div>
  </section>

  <section id="rental">
    <h2 class="section-title">렌트카 (예약 정보)</h2>
    <div class="card" id="rentalContent"></div>
  </section>

  <section id="accommodations">
    <h2 class="section-title">숙소 (가족형 · 에어비앤비 권장)</h2>
    <div class="table-wrap">
      <table id="accommodationTable"></table>
    </div>
  </section>

  <section id="budget">
    <h2 class="section-title">💰 예산 (확정 + 추정)</h2>
    <div class="card" id="budgetContent"></div>
  </section>

  <div id="warnings"></div>

  <section id="tips">
    <h2 class="section-title">실전 팁</h2>
    <div class="tips-grid" id="tipsGrid"></div>
  </section>

</main>

<footer>
  <p id="footerText">2027 유럽 여행 정리 · 항공(중국국제항공)·렌트카(토요타 프로에이스) 확정 기준 · 숙소는 가족형 권장안</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
